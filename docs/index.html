<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veenna Core · Docking molecular com AutoDock Vina</title>
  <meta name="description" content="Veenna Core: docking molecular com AutoDock Vina em lote, ADMET e dinâmica molecular, para Windows 10 e 11.">
  <link rel="icon" href="images/logo.png">
  <meta property="og:title" content="Veenna Core">
  <meta property="og:description" content="Docking molecular com AutoDock Vina em lote, sem linha de comando.">
  <meta property="og:image" content="images/home-dark.png">
  <style>
    /* Mesma paleta do programa: escuro por padrão, claro na troca de tema. */
    :root {
      --bg:#1A2E33; --bar:#1F363C; --card:#24424A; --card-2:#2A4C55; --border:#335C66;
      --gold:#DBB85F; --gold-hover:#E8CA7D; --on-gold:#1A2E33; --accent:#DBB85F;
      --text:#EEF2F1; --muted:#A9BEC3; --shadow:0 18px 50px rgba(0,0,0,.38);
      --hero:linear-gradient(135deg,#2D525A,#203B42 60%,#1C3237);
    }
    html[data-theme="light"] {
      --bg:#F5F7F7; --bar:#EAEFF0; --card:#FFFFFF; --card-2:#F0F4F5; --border:#CBD8DB;
      --gold:#9A7A1E; --gold-hover:#B08D2B; --on-gold:#FFFFFF; --accent:#1C6E5E;
      --text:#17262A; --muted:#6B848A; --shadow:0 18px 50px rgba(23,38,42,.12);
      --hero:linear-gradient(135deg,#DFEAEC,#EFF3F4 60%,#F5F7F7);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); line-height:1.6;
           font-family:"Segoe UI", system-ui, -apple-system, sans-serif; }
    a { color:var(--gold); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }

    /* Barra do topo, no tom do menu de etapas do programa */
    .topbar { background:var(--bar); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
    .topbar .wrap { display:flex; align-items:center; gap:14px; height:58px; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:.4px; font-size:16px; }
    .brand img { width:28px; height:28px; border-radius:8px; }
    .brand span { color:var(--text); }
    .brand i { font-style:normal; color:var(--muted); font-weight:400; }
    .tools { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .chip { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:999px;
            padding:5px 12px; cursor:pointer; font:inherit; font-size:12.5px; line-height:1; }
    .chip:hover { border-color:var(--gold); color:var(--text); }
    .chip.on { background:var(--gold); border-color:var(--gold); color:var(--on-gold); font-weight:600; }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
    .seg button { background:transparent; border:0; color:var(--muted); padding:6px 13px; cursor:pointer; font:inherit; font-size:12.5px; }
    .seg button.on { background:var(--gold); color:var(--on-gold); font-weight:600; }

    /* Herói */
    .hero { background:var(--hero); border:1px solid var(--border); border-radius:18px; margin-top:28px;
            padding:44px 40px; display:grid; grid-template-columns:1fr auto; gap:30px; align-items:center; }
    .eyebrow { color:var(--accent); font-weight:700; font-size:12.5px; letter-spacing:.9px; }
    .hero h1 { font-size:clamp(28px,4vw,40px); line-height:1.18; margin:8px 0 14px; }
    .hero p { color:var(--muted); font-size:17px; max-width:640px; margin:0; }
    .hero img { width:138px; border-radius:30px; box-shadow:var(--shadow); }
    .cta { display:inline-flex; align-items:center; gap:10px; margin-top:26px; background:var(--gold); color:var(--on-gold);
           padding:14px 26px; border-radius:10px; font-weight:700; font-size:16px; }
    .cta:hover { background:var(--gold-hover); text-decoration:none; }
    .meta { color:var(--muted); font-size:13px; margin-top:12px; }

    /* Telas do programa */
    figure { margin:40px 0 10px; }
    .shot { width:100%; height:auto; display:block; border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
    figcaption { color:var(--muted); font-size:13px; text-align:center; margin-top:10px; }

    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:16px; margin:26px 0 44px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px; }
    .card h3 { margin:8px 0 6px; font-size:16px; }
    .card p { margin:0; color:var(--muted); font-size:14px; }
    .icon { font-size:22px; line-height:1; }

    h2 { margin:52px 0 10px; font-size:24px; }
    h2 + p { margin-top:0; }
    p { color:var(--muted); }
    .note { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 22px; font-size:14px; }
    .note p:last-child { margin-bottom:0; }
    ol { color:var(--muted); }
    ol b, p b, .note b { color:var(--text); }
    footer { color:var(--muted); font-size:13px; padding:44px 0; text-align:center; border-top:1px solid var(--border); margin-top:54px; }
    @media (max-width:680px) {
      .hero { grid-template-columns:1fr; padding:30px 22px; }
      .hero img { width:96px; }
      .brand i { display:none; }
    }
  </style>
</head>
<body>

    <div class="card"><div class="icon">🔬</div><h3 data-pt="Dinâmica molecular" data-en="Molecular dynamics"></h3>
      <p data-pt="Simule o complexo na placa de vídeo ou no processador, com MM/GBSA, interações ao longo do tempo e trajetória em 3D."

    <div class="card"><div class="icon">📊</div><h3 data-pt="Resultados" data-en="Results"></h3>

    <div class="card"><div class="icon">📄</div><h3 data-pt="Relatório de métodos" data-en="Methods report"></h3>

    <div class="card"><div class="icon">🔄</div><h3 data-pt="Atualizações seguras" data-en="Secure updates"></h3>
      <p data-pt="Automáticas, assinadas digitalmente e conferidas antes de instalar."
         data-en="Automatic, digitally signed and verified before installing."></p></div>
  </div>

  <figure>
    <img class="shot" id="shot-docking" src="images/docking-dark.png" alt="Docking">
    <figcaption data-pt="Docking: a lista de verificação, os parâmetros do Vina e o terminal de execução de cada ligante."

<script>
  // ---------- tema: segue o Windows e fica guardado na troca ----------
  const prefereClaro = () => window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  let tema = null;
  try { tema = localStorage.getItem("tema"); } catch (e) {}
  function aplicarTema(t) {
    tema = t;
    document.documentElement.dataset.theme = t;
    document.getElementById("bt-theme").textContent = t === "light" ? "☾" : "☀";
    for (const [id, base] of [["shot-home", "home"], ["shot-docking", "docking"]])
      document.getElementById(id).src = "images/" + base + "-" + (t === "light" ? "light" : "dark") + ".png";
    try { localStorage.setItem("tema", t); } catch (e) {}
  }
  document.getElementById("bt-theme").onclick = () => aplicarTema(tema === "light" ? "dark" : "light");

  // ---------- idioma ----------
  function aplicarIdioma(lang) {
    document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    document.querySelectorAll("[data-pt]").forEach(el => { el.textContent = el.dataset[lang]; });
    document.getElementById("bt-pt").classList.toggle("on", lang === "pt");
    document.getElementById("bt-en").classList.toggle("on", lang === "en");
    try { localStorage.setItem("lang", lang); } catch (e) {}
    atualizarVersao();
  }
  let release = null;
  function atualizarVersao() {
    if (!release) return;
    const en = document.documentElement.lang === "en";
    document.getElementById("meta").textContent = (en ? "Version " : "Versão ") + release.tag_name.replace(/^v/, "") +
      " · Windows 10/11 · " + (en ? "5 days free" : "5 dias grátis");
  }
  document.getElementById("bt-pt").onclick = () => aplicarIdioma("pt");
  document.getElementById("bt-en").onclick = () => aplicarIdioma("en");

  let idioma = null;
  try { idioma = localStorage.getItem("lang"); } catch (e) {}
  if (!idioma) idioma = (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
  aplicarTema(tema || (prefereClaro() ? "light" : "dark"));
  aplicarIdioma(idioma);

  // ---------- link direto para o instalador da versão mais recente ----------
  fetch("https://api.github.com/repos/thgdsrbrANJOS/veenna-core-releases/releases/latest")
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return;
      const asset = (data.assets || []).find(a => /\.exe$/i.test(a.name));
      if (asset) document.getElementById("download").href = asset.browser_download_url;
      release = data;
      atualizarVersao();
    })
    .catch(() => {});
</script>
</body>
</html>
