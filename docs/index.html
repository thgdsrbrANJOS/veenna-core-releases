<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veenna Core · Docking molecular com AutoDock Vina</title>
  <meta name="description" content="Veenna Core: docking molecular com AutoDock Vina em lote, para Windows 10 e 11.">
  <link rel="icon" href="images/logo.png">
  <style>
    :root {
      --bg: #1A2E33; --panel: #24424A; --border: #335C66; --petrol: #2D525A;
      --gold: #DBB85F; --gold-hover: #E8CA7D; --text: #EEF2F1; --muted: #A9BEC3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.6; }
    a { color: var(--gold); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .5px; color: var(--gold); font-size: 20px; }
    .brand img { width: 44px; height: 44px; border-radius: 10px; }
    .lang button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 16px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    .lang button.on { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 600; }
    .hero { background: linear-gradient(135deg, #2D525A, #203B42 60%, #1C3237); border: 1px solid var(--border); border-radius: 18px;
            padding: 44px 36px; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; }
    .hero h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 6px 0 12px; }
    .eyebrow { color: var(--gold); font-weight: 600; font-size: 13px; letter-spacing: .6px; }
    .hero p { color: var(--muted); font-size: 17px; max-width: 620px; margin: 0; }
    .hero img { width: 150px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; background: var(--gold); color: var(--bg);
           padding: 14px 24px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 16px; }
    .cta:hover { background: var(--gold-hover); }
    .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .shot { margin: 36px 0; border-radius: 14px; border: 1px solid var(--border); width: 100%; height: auto; display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 24px 0 40px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .card h3 { margin: 6px 0; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .icon { font-size: 22px; }
    h2 { margin-top: 48px; }
    footer { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
    @media (max-width: 640px) { .hero { grid-template-columns: 1fr; padding: 28px 20px; } .hero img { width: 96px; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="images/logo.png" alt=""> VEENNA CORE</div>
    <div class="lang"><button id="bt-pt" class="on">PT</button> <button id="bt-en">EN</button></div>
  </header>

  <section class="hero">
    <div>
      <div class="eyebrow" data-pt="DOCKING MOLECULAR · AUTODOCK VINA" data-en="MOLECULAR DOCKING · AUTODOCK VINA"></div>
      <h1 data-pt="Docking molecular em lote, sem linha de comando" data-en="Batch molecular docking, no command line"></h1>
      <p data-pt="Carregue o receptor, monte a fila de ligantes, defina a caixa de busca e acompanhe cada ligante em tempo real. O AutoDock Vina é baixado e executado automaticamente."
         data-en="Load the receptor, queue the ligands, set the search box and follow every ligand in real time. AutoDock Vina is downloaded and run automatically."></p>
      <a class="cta" id="download" href="https://github.com/thgdsrbrANJOS/veenna-core-releases/releases/latest">
        ⬇ <span data-pt="Baixar para Windows" data-en="Download for Windows"></span>
      </a>
      <div class="meta" id="meta" data-pt="Windows 10 e 11 · 5 dias grátis com todos os recursos" data-en="Windows 10 and 11 · 5 days free with every feature"></div>
    </div>
    <img src="images/logo.png" alt="Veenna Core">
  </section>

  <img class="shot" src="images/home-v4.7.2.png" alt="Veenna Core">

  <div class="grid">
    <div class="card"><div class="icon">⚙️</div><h3 data-pt="Vina automático" data-en="Automatic Vina"></h3>
      <p data-pt="Baixa e executa o AutoDock Vina sem Git Bash nem terminal." data-en="Downloads and runs AutoDock Vina with no Git Bash or terminal."></p></div>
    <div class="card"><div class="icon">🧪</div><h3 data-pt="Ligantes em paralelo" data-en="Parallel ligands"></h3>
      <p data-pt="Até 2 ao mesmo tempo, com progresso e um terminal para cada." data-en="Up to 2 at once, with progress and one terminal each."></p></div>
    <div class="card"><div class="icon">🎯</div><h3>Auto-Box</h3>
      <p data-pt="Centro e tamanho da caixa a partir do ligante do cristal." data-en="Box center and size from the crystal ligand."></p></div>
    <div class="card"><div class="icon">⚗️</div><h3 data-pt="Preparo de ligantes" data-en="Ligand preparation"></h3>
      <p data-pt="Protonação no pH, conformações e otimização GFN2-xTB ou DFT (Psi4), além de MOPAC e OpenBabel." data-en="pH protonation, conformers and GFN2-xTB or DFT (Psi4) optimization, plus MOPAC and OpenBabel."></p></div>
    <div class="card"><div class="icon">📊</div><h3 data-pt="Resultados" data-en="Results"></h3>
      <p data-pt="Tabela, gráfico, CSV para Excel, poses em MOL2 e Discovery Studio." data-en="Table, chart, CSV for Excel, MOL2 poses and Discovery Studio."></p></div>
    <div class="card"><div class="icon">🔄</div><h3 data-pt="Atualizações seguras" data-en="Secure updates"></h3>
      <p data-pt="Atualizações automáticas, assinadas digitalmente e conferidas antes de instalar." data-en="Automatic updates, digitally signed and verified before installing."></p></div>
  </div>

  <h2 data-pt="Comprar uma licença" data-en="Buy a license"></h2>
  <p data-pt="Abra a tela Licença dentro do programa: lá estão os canais de contato e o seu ID de hardware. Você recebe um arquivo .lic e é só arrastá-lo para a tela de ativação."
     data-en="Open the License screen inside the program: it shows the contact channels and your hardware ID. You will receive a .lic file; just drop it on the activation screen."></p>

  <h2 data-pt="Licenças e termos de uso" data-en="Licenses and terms of use"></h2>
  <p data-pt="O Veenna Core é software proprietário, com avaliação gratuita de 5 dias a partir do primeiro uso. Os termos completos aparecem no instalador e devem ser aceitos antes da instalação: licença pessoal e intransferível, vinculada ao computador; resultados de docking, protonação, otimização e ADMET são estimativas computacionais para pesquisa, sem garantia e sem uso clínico; o programa não envia suas moléculas nem dados pessoais."
     data-en="Veenna Core is proprietary software, with a 5-day free evaluation from the first use. The full terms are shown in the installer and must be accepted before installing: personal, non-transferable license bound to the computer; docking, protonation, optimization and ADMET results are computational estimates for research, with no warranty and no clinical use; the program does not send your molecules or personal data."></p>
  <p data-pt="Componentes de terceiros, cada um sob a própria licença (todas de código aberto e com uso comercial permitido): Ketcher (Apache 2.0), OpenChemLib JS e 3Dmol.js (BSD 3-Clause), .NET e QRCoder (MIT), WebView2 SDK (Microsoft); baixados das fontes oficiais quando você pede: AutoDock Vina e MOPAC (Apache 2.0), Open Babel (GPL 2.0, sem modificações), PROPKA (LGPL 2.1), OpenMM/PDBFixer (MIT), ADMET-AI (MIT), RDKit (BSD), xtb/GFN2-xTB (LGPL 3.0), Dimorphite-DL (Apache 2.0), Psi4 e simple-dftd3 (LGPL 3.0), instalados pelo micromamba (BSD) a partir do conda-forge. Dados: RCSB PDB (CC0), AlphaFold DB (CC BY 4.0) e percentil DrugBank do ADMET-AI (CC BY-NC 4.0). Texto completo no programa, em Ferramentas e ajustes."
     data-en="Third-party components, each under its own license (all open source and allowing commercial use): Ketcher (Apache 2.0), OpenChemLib JS and 3Dmol.js (BSD 3-Clause), .NET and QRCoder (MIT), WebView2 SDK (Microsoft); downloaded from the official sources when you ask: AutoDock Vina and MOPAC (Apache 2.0), Open Babel (GPL 2.0, unmodified), PROPKA (LGPL 2.1), OpenMM/PDBFixer (MIT), ADMET-AI (MIT), RDKit (BSD), xtb/GFN2-xTB (LGPL 3.0), Dimorphite-DL (Apache 2.0), Psi4 and simple-dftd3 (LGPL 3.0), installed by micromamba (BSD) from conda-forge. Data: RCSB PDB (CC0), AlphaFold DB (CC BY 4.0) and the ADMET-AI DrugBank percentile (CC BY-NC 4.0). Full text inside the program, in Tools and settings."></p>

  <footer>© 2026 Thiago Anjos · <span data-pt="Os componentes de terceiros pertencem aos seus autores e seguem as próprias licenças." data-en="Third-party components belong to their authors and follow their own licenses."></span></footer>
</div>

<script>
  // Idioma
  function setLang(lang) {
    document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    document.querySelectorAll("[data-pt]").forEach(el => el.textContent = el.dataset[lang]);
    document.getElementById("bt-pt").classList.toggle("on", lang === "pt");
    document.getElementById("bt-en").classList.toggle("on", lang === "en");
    try { localStorage.setItem("lang", lang); } catch (e) {}
    updateMeta();
  }
  let release = null;
  function updateMeta() {
    if (!release) return;
    const en = document.documentElement.lang === "en";
    document.getElementById("meta").textContent = (en ? "Version " : "Versão ") + release.tag_name.replace(/^v/, "") +
      " · Windows 10/11 · " + (en ? "5 days free" : "5 dias grátis");
  }
  document.getElementById("bt-pt").onclick = () => setLang("pt");
  document.getElementById("bt-en").onclick = () => setLang("en");
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(saved || (navigator.language || "pt").toLowerCase().startsWith("pt") ? (saved || "pt") : "en");

  // Link direto para o instalador da versão mais recente
  fetch("https://api.github.com/repos/thgdsrbrANJOS/veenna-core-releases/releases/latest")
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return;
      const asset = (data.assets || []).find(a => /\.exe$/i.test(a.name));
      if (asset) document.getElementById("download").href = asset.browser_download_url;
      release = data;
      updateMeta();
    })
    .catch(() => {});
</script>
</body>
</html>
